# cad.yaml -- what cad/check.py builds, checks and grades. One per project, at its root.
# The design numbers themselves live in params.py; this file says how to run
# and judge the model. Paths are relative to this file.
#
# level:  hard = check.py exits 1 when it fails;  soft = warning only.
# status: IN_FLUX = the human is still tuning it, a change is not a regression.
#         ASSUMPTION = nobody has confirmed it yet (same tag as params.py).

project: halloween animatronic
stl_dir: output/stl      # where builders write STLs (the print files)
out: output/check        # check results -- gitignore it
params: cad/params.py    # `param:` targets and components_check read this
inputs: inputs           # components/ (manufacturer STEP models) lives here
# copy_also: [inputs/reference]   # extra files the builders read during a check

printer:
  bed: [256, 256, 256]   # DATASHEET: 2x Bambu Lab P2S (PLAN Q2)
  nozzle: 0.4
  min_wall: 0.8          # thinnest wall: two extrusion widths
  overhang_deg: 45       # from vertical
  ledge_w: 3.0           # one-sided overhangs this narrow print without support
  bridge_span: 10.0      # roofs held by walls all round print this far

# Run order. Everything runs in check.py's private copy of the source folder,
# so builders never touch the real stl_dir during a check. Consecutive `check`
# steps run in parallel; a failed build stops the run. `pass`: regex that must
# match one output line (for scripts whose exit code alone isn't trustworthy).
# `fail`: regex for the lines quoted in the report (default: lines starting
# with FAIL or WARN).
pipeline:
  - {script: components_check, kind: check, level: soft, pass: "^COMPONENTS MATCH PARAMS$"}
  - {script: modules, kind: build}       # Cogley modules placed in the head frame -> output/ref (not print files)
  - {script: cogley_head, kind: build}   # D14: Cogley's whole head a2.0.33 in our frame -> output/ref/head_a2 (not print files)
  - {script: head, kind: build}          # proxy head envelopes -> output/ref (not print files)
  - {script: reserve, kind: build}       # reserved space: brow bays, cable channel -> output/ref
  - {script: brow, kind: build}          # M2 eyebrow mechanism v1: carriers, brackets (+ servo refs)
  - {script: brow_rig, kind: build}      # M2 bench rig for the left brow (a forehead fragment)
  - {script: skull, kind: build}         # M3 skull v0: shell pieces with openings, shelf, brow mount plates
  - {script: sculpt_base, kind: build}   # M5: the wrap of Cogley's head (the mask clears it); sculpt_* superseded by the mask
  - {script: face_mask, kind: build}     # M5 D19: a man's face shell on the mechanism, to sculpt on
  - {script: mold_base, kind: build}     # M5: the printed base the clay-covered mask lies in, face up, for the plaster mold
  - {script: enclosure, kind: build}     # M8: the canister (base, rings, column, cap, panels) and the neck (D23-D25)
  - {script: test_coupon, kind: build}
  - {script: assembly_check, kind: check, level: hard, pass: "^NO OVERLAPS$"}
  - {script: print_check, kind: check, level: soft, pass: "^PRINT CHECK OK$"}
  - {script: layout_check, kind: check, level: soft, pass: "^LAYOUT OK$"}   # M1: modules vs each other and the head
  - {script: pose_sweep, kind: check, level: soft, pass: "^SWEEP OK$"}      # M1: jaw, eyes, lids moving; reserved space
  - {script: brow_check, kind: check, level: soft, pass: "^BROW OK$"}       # M2: brows through their travel
  - {script: skull_check, kind: check, level: soft, pass: "^SKULL OK$"}     # M3: skull vs everything, at rest and moving
  - {script: sculpt_check, kind: check, level: soft, pass: "^SCULPT OK$"}   # M5: sculpt base vs the skull
  - {script: service_check, kind: check, level: soft, pass: "^SERVICE OK$"} # M3: teardown paths, tool access
  - {script: mold_check, kind: check, level: soft, pass: "^MOLD OK$"}       # M5: mold base vs the mask: seat, no hooks, bed
  - {script: enclosure_check, kind: check, level: soft, pass: "^ENCLOSURE OK$"}   # M8: head, sheet, his parts, the jaw sweep, the bay

# Scripts in the source folder that check.py knows about but doesn't run
# (the toolkit's own scripts are known already). Any other script gets a
# warning, so a new builder or check can't be silently left out.
not_in_pipeline: [params, geom, snapshot, browgeom, export_print, make_plates, read3mf, wrap]

# Every print file, by STL name: the one place to update when a part is added,
# renamed or printed differently. check.py warns about a built STL that isn't
# listed here and about a listed part that wasn't built.
#   colour        RGB 0..1, for the views and the STEP
#   supports      what the print guide says; print_check warns about overhangs
#                 only on parts printed without supports
#   print_rotate  degrees about x, y, z from the assembled pose to the print pose
#                 (default: prints as modelled, base down)
#   assembly      false = not in its assembled place (calibration prints, parts
#                 exported at their print origin): left out of the overall size,
#                 the views, the overlap check and the STEP
#   inspect_from  camera direction for print_check's low view (default 0.6, 1, -0.6)
parts:
  test_coupon: {colour: [0.70, 0.70, 0.70], supports: false, assembly: false}
  # M2 eyebrows. Carriers print with the hub axis vertical, hub at the bottom (round bore
  # and ball-stud hole), on tree supports (no flat face); brackets print upside down on
  # their top flange.
  brow_carrier_L: {colour: [0.85, 0.35, 0.40], supports: true, print_rotate: [90, -78, 0]}
  brow_carrier_R: {colour: [0.85, 0.35, 0.40], supports: true, print_rotate: [90, 78, 0]}
  brow_bracket_L: {colour: [0.62, 0.62, 0.66], supports: false, print_rotate: [180, 0, 0]}
  brow_bracket_R: {colour: [0.62, 0.62, 0.66], supports: false, print_rotate: [180, 0, 0]}
  # bench fixture, not part of the head: prints lying on its inner wall (open outer side), with
  # supports under the inside of the shell where it curves round the temple
  brow_rig: {colour: [0.80, 0.78, 0.70], supports: true, assembly: false, print_rotate: [0, -90, 0]}   # supports under the shell's curve
  # M3 skull v0. Print poses are a first guess (split face on the bed); M3 optimises them.
  # Retired by D17 (Cogley's head is built as designed); still built and checked, but out of the
  # assembly since 2026-10-28: the neck and the enclosure's pedestal (M8) now stand where its neck was.
  skull_front_upper: {colour: [0.93, 0.89, 0.78], supports: true, assembly: false}
  skull_front_lower: {colour: [0.88, 0.84, 0.72], supports: true, assembly: false, print_rotate: [180, 0, 0]}
  skull_back_upper: {colour: [0.80, 0.76, 0.66], supports: true, assembly: false}
  skull_back_lower: {colour: [0.75, 0.71, 0.62], supports: true, assembly: false, print_rotate: [180, 0, 0]}
  skull_shelf: {colour: [0.55, 0.75, 0.75], supports: false, assembly: false}
  skull_eye_strap: {colour: [0.55, 0.75, 0.75], supports: false, assembly: false, print_rotate: [180, 0, 0]}
  skull_neck_plate: {colour: [0.45, 0.60, 0.70], supports: false, assembly: false}
  skull_access_panel: {colour: [0.70, 0.66, 0.56], supports: true, assembly: false}
  sculpt_upper: {colour: [0.80, 0.62, 0.52], supports: false, assembly: false}        # solid: 3 walls, lightning infill
  sculpt_lower: {colour: [0.76, 0.58, 0.48], supports: false, assembly: false, print_rotate: [180, 0, 0]}
  sculpt_plate: {colour: [0.45, 0.45, 0.50], supports: false, assembly: false}
  face_mask: {colour: [0.88, 0.86, 0.84], supports: true, assembly: false, print_rotate: [90, 0, 0]}   # face up; tree supports inside
  # M5 mold base: modelled in the mold pose (face up), which is the print pose: plate on the bed, no supports
  mold_base_chin_L: {colour: [0.45, 0.62, 0.78], supports: false, assembly: false}
  mold_base_chin_R: {colour: [0.38, 0.55, 0.72], supports: false, assembly: false}
  mold_base_top_L: {colour: [0.55, 0.70, 0.62], supports: false, assembly: false}
  mold_base_top_R: {colour: [0.48, 0.64, 0.56], supports: false, assembly: false}
  # the 4 wall corners stand on the base's plate (separate prints, so they come off before the plaster is lifted)
  mold_wall_chin_L: {colour: [0.62, 0.62, 0.66], supports: false, assembly: false}
  mold_wall_chin_R: {colour: [0.55, 0.55, 0.60], supports: false, assembly: false}
  mold_wall_top_L: {colour: [0.66, 0.64, 0.58], supports: false, assembly: false}
  mold_wall_top_R: {colour: [0.60, 0.58, 0.52], supports: false, assembly: false}
  mold_pry_wedge: {colour: [0.95, 0.55, 0.15], supports: false, assembly: false}   # print 8: loose, against the walls
  # M8 enclosure v1 (D23-D26): eleven thin prints plus two PETG sheets. The halves turn 45 deg on the
  # bed (a half of D 292 spans 249). The cap halves and the pedestal print upside down (their lips,
  # skirt, stops and flange then stand up); the rings and the tray print as modelled (lips and rims
  # up); the panels stand on a short edge so their slots print vertical. Nothing needs support.
  enc_cap_F: {colour: [0.55, 0.60, 0.66], supports: false, print_rotate: [180, 0, 45]}
  enc_cap_B: {colour: [0.55, 0.60, 0.66], supports: false, print_rotate: [180, 0, 45]}
  enc_top_F: {colour: [0.62, 0.66, 0.72], supports: false, print_rotate: [0, 0, 45]}
  enc_top_B: {colour: [0.62, 0.66, 0.72], supports: false, print_rotate: [0, 0, 45]}
  enc_bottom_F: {colour: [0.45, 0.50, 0.56], supports: false, print_rotate: [0, 0, 45]}
  enc_bottom_B: {colour: [0.45, 0.50, 0.56], supports: false, print_rotate: [0, 0, 45]}
  enc_tray: {colour: [0.45, 0.50, 0.56], supports: false}
  enc_pedestal: {colour: [0.60, 0.66, 0.72], supports: false, print_rotate: [180, 0, 0]}
  enc_grille: {colour: [0.25, 0.28, 0.32], supports: true, print_rotate: [90, 0, 0]}    # lying, inside face down: supports under the arch, the outside stays clean
  enc_hatch: {colour: [0.25, 0.28, 0.32], supports: true, print_rotate: [-90, 0, 0]}
  neck: {colour: [0.80, 0.64, 0.30], supports: false}

every_part: {watertight: hard, single_body: hard, fits_bed: soft}

# Metrics: assembly.x / .y / .z / .z_min (the assembled model, mm) and
# part.<name>.x / .y / .z / .volume. `param:` reads the target from params.py.
targets: []   # skull parts add size and param targets here (M3)
